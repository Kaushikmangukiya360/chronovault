[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronovault"
version = "1.0.0"
description = "Enterprise time-keyed encrypted JSON database for Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42.0.0",
  "filelock>=3.13.0",
  "click>=8.1.0",
  "rich>=13.0.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "ipaddress",
  "python-multipart>=0.0.9",
]

[project.scripts]
chronovault = "chronovault.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["chronovault*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
